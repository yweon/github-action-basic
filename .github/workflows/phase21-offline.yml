name: Phase21 offline dependency proof
on:
  push:
    branches: [phase21-offline-20261023]
    paths: [phase21_offline_build.py, .github/workflows/phase21-offline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: bt, python: '3.12.10'}
          - {os: windows-2022, target: qlib, python: '3.12.10'}
          - {os: ubuntu-22.04, target: qlib, python: '3.12.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build and validate offline environment
        run: python phase21_offline_build.py ${{ matrix.target }}
      - name: Preserve wheelhouses and exact failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase21-${{ matrix.target }}-${{ matrix.os }}-cp312-x64
          path: |
            bundle/*/wheels
            bundle/*/logs
            bundle/*/status.json
            bundle/*/manifest.json
            bundle/*/requirements.lock
            bundle/*/constraints.txt
            bundle/*/source-pinned.zip
          retention-days: 14
          if-no-files-found: warn
