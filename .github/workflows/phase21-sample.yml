name: Phase21 existing artifact sample check
on:
  push:
    branches: [phase21-offline-20261023]
    paths: [phase21_sample_smoke.py, .github/workflows/phase21-sample.yml]
permissions:
  contents: read
  actions: read
jobs:
  sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v4
        with:
          run-id: 39947053518
          github-token: ${{ github.token }}
          path: downloads
      - run: python phase21_sample_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase21-qlib-sample-proof
          path: |
            proof/*.json
            proof/*.txt
          retention-days: 14
